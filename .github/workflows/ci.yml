name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # buf breaking needs the baseline's history
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: make tools
      - run: make lint-api
      - name: buf breaking
        # Picks the baseline per event, then guards the bootstrap commit.
        #
        # Baseline: on a pull request, origin/main is the branch being merged
        # into and is the right baseline. On a push it is not — checkout runs
        # after the push, so origin/main already points at the pushed tip and
        # comparing against it is HEAD-versus-HEAD, which can never fail. The
        # pre-push tip (github.event.before) is the only baseline that makes
        # the check mean anything for commits that land without a PR. When
        # that commit is not in the checkout it is fetched by SHA, and if it
        # still cannot be reached the step fails rather than skipping.
        #
        # Bootstrap guard: before api/ lands on the baseline, that commit has
        # no buf.yaml, so buf can't scope a module and fails on unrelated
        # protos instead of cleanly reporting a missing api/. The guard skips
        # exactly that one run and is a no-op forever after. `git cat-file -e`
        # alone can't tell "the baseline has no api/" apart from "the baseline
        # does not resolve at all", so resolve the ref first and fail loudly
        # if it doesn't — otherwise an unresolvable ref would silently skip
        # this check forever instead of just once.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            baseline="$BEFORE_SHA"
            # Branch creation is the one case with no prior API state at all,
            # so there is nothing a breaking change could break. Every other
            # missing-baseline case fails closed below.
            if [ "$baseline" = "0000000000000000000000000000000000000000" ]; then
              echo "branch was just created; no prior API state to break"
              exit 0
            fi
            # A force push can orphan the pre-push tip, and fetch-depth: 0
            # fetches branches, not unreachable objects — so ask the remote
            # for the commit directly before concluding it is gone.
            if ! git cat-file -e "$baseline^{commit}" 2>/dev/null; then
              echo "pre-push commit $baseline not in checkout (forced=$FORCED); fetching it"
              git fetch --no-tags --quiet origin "$baseline" || true
            fi
            # Fail closed. Skipping here would let a force push carrying a
            # breaking change land with a green build, which is precisely the
            # case this check exists to catch.
            if ! git cat-file -e "$baseline^{commit}" 2>/dev/null; then
              echo "::error::pre-push commit $baseline is unreachable (forced=$FORCED); cannot compare api/ against the state this push replaced"
              exit 1
            fi
          else
            baseline=origin/main
            git rev-parse --verify -q "$baseline" >/dev/null || { echo "$baseline did not resolve"; exit 1; }
          fi
          if git cat-file -e "$baseline:api" 2>/dev/null; then
            make breaking-api BREAKING_AGAINST="$baseline"
          else
            echo "baseline $baseline has no api/ yet; skipping the first breaking check"
          fi
      - run: make generate
      - run: go build ./...
      - name: verify gen/ is in sync with api/
        # Staged before diffing so added and deleted files fail the check too,
        # not just modified ones.
        run: git add -A gen && git diff --cached --exit-code -- gen
