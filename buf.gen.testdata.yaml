version: v2
clean: true
plugins:
  - local: protoc-gen-go
    out: internal/testpb
    opt:
      - paths=source_relative
      - Mshop/v1/order.proto=github.com/yinghanhung/simulacra/internal/testpb/shop/v1;shopv1
  - local: protoc-gen-go-grpc
    out: internal/testpb
    opt:
      - paths=source_relative
      - Mshop/v1/order.proto=github.com/yinghanhung/simulacra/internal/testpb/shop/v1;shopv1
