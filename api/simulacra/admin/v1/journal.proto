syntax = "proto3";

package simulacra.admin.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/yinghanhung/simulacra/gen/simulacra/admin/v1;adminv1";

// JournalService reads the recent-call journal.
service JournalService {
  rpc ListCalls(ListCallsRequest) returns (ListCallsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc WatchCalls(WatchCallsRequest) returns (stream WatchCallsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ResetJournal(ResetJournalRequest) returns (ResetJournalResponse);
}

// DecodedMessage carries a data-plane message to clients that do not know its
// type: json for argument capture in any language, wire_bytes for typed
// capture against the client's own generated classes.
message DecodedMessage {
  // Fully-qualified message name.
  string type_name = 1;
  // Canonical protobuf encoding.
  bytes wire_bytes = 2;
  // protojson, rendered against the server registry.
  string json = 3;
}

// MetadataEntry is one gRPC metadata key and all of its values. gRPC metadata
// is multi-valued, which a proto3 map cannot express.
//
// The gRPC metadata rules split values by key, and so does this message:
// exactly one of values / binary_values is populated for a given entry. Keys
// ending in "-bin" carry arbitrary bytes and use binary_values; every other
// key carries ASCII text and uses values. Binary values cannot share the
// string field — a proto3 string must be valid UTF-8, and marshaling raw
// metadata bytes into one fails outright rather than degrading. Keeping text
// out of bytes matters too: it stays readable in JSON instead of base64.
message MetadataEntry {
  string key = 1;
  // Values for keys that do not end in "-bin".
  repeated string values = 2;
  // Values for keys ending in "-bin", as the raw bytes the application sees
  // (grpc-go's metadata.MD holds them already base64-decoded), not the
  // base64 form used on the wire.
  repeated bytes binary_values = 3;
}

message CallStatus {
  // gRPC status code; 0 is OK.
  int32 code = 1;
  string message = 2;
  // Deliberately DecodedMessage rather than google.protobuf.Any. Details are
  // built from dynamically registered types (see internal/stub.compileStatus),
  // which are absent from protoregistry.GlobalTypes. Connect's default JSON
  // codec marshals with a zero protojson.MarshalOptions, whose nil Resolver
  // falls back to GlobalTypes, so an Any holding a runtime-only type fails to
  // render over JSON while working fine over binary protobuf. DecodedMessage
  // sidesteps that: the server renders json against its own registry, and
  // wire_bytes still lets a client decode against its own generated types.
  repeated DecodedMessage details = 3;
}

// Call is one completed data-plane RPC.
message Call {
  uint64 seq = 1;
  string method = 2;
  // Request metadata only. Deliberately qualified: response headers and
  // trailers (see stub.Respond.Metadata, stub.Respond.Trailers) are plausible
  // additions later, and an unqualified "metadata" would then be ambiguous.
  repeated MetadataEntry request_metadata = 3;
  repeated DecodedMessage requests = 4;
  repeated DecodedMessage responses = 5;
  CallStatus status = 6;
  string matched_stub_id = 7;
  google.protobuf.Timestamp start = 8;
  google.protobuf.Duration duration = 9;
}

message ListCallsRequest {
  // Optional method filter, normalized "/pkg.Service/Method" as in
  // stub.Stub.method.
  string method = 1;
  // 0 means no limit.
  int32 limit = 2;
}

message ListCallsResponse {
  // Newest first.
  repeated Call calls = 1;
}

message WatchCallsRequest {
  // Optional method filter, normalized "/pkg.Service/Method" as in
  // stub.Stub.method.
  string method = 1;
}

message WatchCallsResponse {
  Call call = 1;
}

message ResetJournalRequest {}

message ResetJournalResponse {}
